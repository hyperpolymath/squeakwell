#
# Vordr runtime monitoring configuration for squeakwell
#
# Vordr watches container health, detects crashes, tracks resource usage,
# and emits structured logs. squeakwell is a batch recovery CLI with no HTTP
# endpoint, so there is no health probe here: vordr's value for squeakwell
# is crash detection (a non-zero exit of a recovery batch) and resource
# tracking while a batch runs.
#
# Usage:
#   vordr watch --config container/vordr.toml
#   vordr status
#   vordr report

[metadata]
name = "squeakwell"
version = "0.1.0"

# ============================================================================
# Health Monitoring
# ============================================================================
#
# Disabled: a batch job has no /health or /ready endpoint. A batch that is
# still running is healthy; one that exited non-zero is a crash (below).

[health]
enabled = false
on_failure = "alert"

# ============================================================================
# Crash Detection
# ============================================================================
#
# Monitors container state via Podman. A recovery batch exiting non-zero is
# the crash signal. Batches are not restarted automatically: a failed batch
# leaves its working directory on its own volume for inspection.

[crash_detection]
enabled = true
max_restarts = 0
restart_window = "10m"

# ============================================================================
# Resource Thresholds
# ============================================================================
#
# Alert when resource usage exceeds these thresholds. Values are percentages
# of the container's cgroup limits (or host limits if uncapped).

[resources]
cpu_warn = 80       # Percentage — warn at 80% sustained CPU.
cpu_critical = 95   # Percentage — critical alert at 95%.
memory_warn = 75    # Percentage of memory limit.
memory_critical = 90
disk_warn = 80      # Percentage of the batch volume's usage.
disk_critical = 95

# Sample interval for resource metrics.
sample_interval = "15s"

# ============================================================================
# Log Output
# ============================================================================

[logging]
format = "json"
level = "info"
output = "stdout"
# file = "/var/log/vordr/squeakwell.log"

# ============================================================================
# Notifications (optional)
# ============================================================================

# [notifications.webhook]
# url = "https://example.com/hooks/vordr"
# method = "POST"
# headers = { "Content-Type" = "application/json" }
# on = ["failure", "resource_critical"]

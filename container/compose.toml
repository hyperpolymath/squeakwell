# SPDX-License-Identifier: MPL-2.0
#
# squeakwell selur-compose configuration
#
# squeakwell is a batch recovery CLI, not a long-running service: it opens
# no port and needs no edge gateway. This stack runs ONE recovery batch as a
# verified .ctp container against the VeriSimDB named by VERISIMDB_URL, with
# the batch working directory on its own named volume. The k9 component in
# deploy.k9.ncl is the primary way to run batches; this file is the
# selur-compose equivalent for operators who already run a selur stack.
#
# Usage:
#   BATCH_ID=20261109T120000Z VERISIMDB_URL=https://verisim.example selur-compose up
#   selur-compose verify                 # Verify the .ctp signature
#   selur-compose logs squeakwell        # Read the batch log
#   selur-compose down                   # Remove the stopped batch container
#
# Fallback (when selur is not installed):
#   podman compose --file compose.toml up

version = "1.0"

# ============================================================================
# Services
# ============================================================================

[services.squeakwell]
image = "ghcr.io/hyperpolymath/squeakwell:latest.ctp"
command = ["recover", "--workdir", "/data"]
# TOML 1.0: an inline table stays on one line with no trailing comma.
environment = { APP_LOG_FORMAT = "json", APP_DATA_DIR = "/data", VERISIMDB_URL = "${VERISIMDB_URL}" }
# One volume per batch; see deploy.k9.ncl for the matching rollback rule.
volumes = ["squeakwell-data-${BATCH_ID}:/data"]
# A batch runs once; do not restart it.
restart = "no"

# ============================================================================
# Volumes
# ============================================================================

[volumes."squeakwell-data-${BATCH_ID}"]
driver = "local"

# ============================================================================
# Networks
# ============================================================================

# Outbound only (to VERISIMDB_URL). No inter-service IPC is needed.
[networks.default]
driver = "bridge"
